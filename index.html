<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Quick Notes</h1>
  </header>

  <main>
    <!-- Section 1: Note Creation Form -->
    <section aria-labelledby="create-note-heading">
      <h2 id="create-note-heading">Add a New Note</h2>
      
      <form id="note-form" novalidate>
        <div class="form-group">
          <label for="note-input">Note Content</label>
          <input 
            type="text" 
            id="note-input" 
            name="noteInput" 
            placeholder="Type your note here..."
            autocomplete="off"
            aria-describedby="error-message"
          >
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category" name="noteCategory">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Ideas">Ideas</option>
            <option value="Tasks">Tasks</option>
          </select>
        </div>

        <button type="submit" id="add-note-btn">Save Note</button>
      </form>

      <!-- Live validation message display -->
      <p id="error-message" role="alert" aria-live="polite"></p>
    </section>

    <!-- Section 2: Note Management, Search, and Display -->
    <section aria-labelledby="notes-list-heading">
      <h2 id="notes-list-heading">Your Notes</h2>

      <div class="search-bar">
        <label for="search-input">Search Notes</label>
        <input 
          type="search" 
          id="search-input" 
          placeholder="Filter notes by title or content..."
        >
      </div>

      <p id="note-count">Total notes: 0</p>

      <ul id="notes-list" aria-live="polite"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Quick Notes App. All rights reserved.</p>
  </footer>
</body>
</html>
